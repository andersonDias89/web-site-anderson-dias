name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure public URLs
        env:
          BASE_PATH_OVERRIDE: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
          SITE_URL_OVERRIDE: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY_OWNER}"

          if [ -n "$SITE_URL_OVERRIDE" ]; then
            site_url="$SITE_URL_OVERRIDE"
          elif [ "$repo_name" = "$owner.github.io" ]; then
            site_url="https://$owner.github.io"
          else
            site_url="https://$owner.github.io/$repo_name"
          fi

          if [ -n "$BASE_PATH_OVERRIDE" ]; then
            base_path="$BASE_PATH_OVERRIDE"
          elif [ -n "$SITE_URL_OVERRIDE" ] || [ "$repo_name" = "$owner.github.io" ]; then
            base_path=""
          else
            base_path="/$repo_name"
          fi

          echo "NEXT_PUBLIC_SITE_URL=$site_url" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_BASE_PATH=$base_path" >> "$GITHUB_ENV"

      - name: Build static export
        env:
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_WHATSAPP_URL: ${{ vars.NEXT_PUBLIC_WHATSAPP_URL }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
